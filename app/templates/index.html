<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AAPM Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/app/static/css/index.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

    <!-- ICONES -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>

<body>

    <div class="background">

    <img
        src="/app/static/img/circulo.png"
        alt=""
        class="rotating-circle"
>
<header>

    <nav class="navbar">

        <img
            src="/app/static/img/logo.png"
            alt="Logo AAPM"
            class="navbar-logo"
        >

        
    </nav>

</header>

 


        <!-- CONTEÚDO -->
        <main class="container">

            <!-- ESQUERDA -->
            <section class="left">

                <h1 class="logo-text">
                    AAPM
                </h1>

                <p>
                    A AAPM é uma entidade sem fins lucrativos
                    presente em diversas unidades com o objetivo
                    de apoiar a melhoria da infraestrutura,
                    atividades pedagógicas e vivência escolar.
                </p>

            </section>


            <!-- DIREITA -->
            <section class="right">

                <div class="login-card">

                    <h1>Entrar</h1>


                    <div class="input-box">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            placeholder="Email"
                        >

                    </div>


                    <div class="input-box">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            placeholder="Senha"
                        >

                    </div>


                    <button>
                        Login
                    </button>

                </div>

            </section>

        </main>

    </div>

</body>
</html>
