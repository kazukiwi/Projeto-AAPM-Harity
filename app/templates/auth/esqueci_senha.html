<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci minha senha | AAPM</title>
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body class="auth-page">
    <main class="container">
        <section class="right">
            <div class="login-card">
                <h1>Redefinir senha</h1>
                {% if mensagem %}
                <p class="auth-feedback auth-feedback-success" role="status">{{ mensagem }}</p>
                {% endif %}
                <form method="post" action="/auth/esqueci-senha">
                    <div class="input-box"><input type="email" name="email" placeholder="Seu e-mail" required></div>
                    <button type="submit">Enviar link</button>
                </form>
                <p class="password-action password-action-back">
                    <a href="/"><span aria-hidden="true">←</span> Voltar ao login</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
